# Free Streamlit Community Cloud apps sleep after a period without visitors.
# Every 6 hours this opens the app in a headless browser and, if it is asleep, presses the wake-up button.
name: keep-awake
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.55.0 && python -m playwright install --with-deps chromium
      - name: Visit and wake the app
        env:
          APP_URL: https://aftershock-65s8t49dssedatgfw5zpv8.streamlit.app/
        run: |
          python - <<'PY'
          import os, time
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page()
              pg.goto(os.environ["APP_URL"], timeout=120000)
              time.sleep(10)
              btn = pg.get_by_role("button", name="Yes, get this app back up!")
              if btn.count():
                  btn.first.click()
                  print("app was asleep: wake-up requested")
                  time.sleep(90)
              else:
                  print("app is awake")
              b.close()
          PY
